<style>
/* Layout: one narrow column for reading screens; the life screen is a two-column field station (specimen card | scene + record). Dark-first: most animals live in soil and deep water. */
:root {

}
@media (prefers-color-scheme: light) {

}

}

* { box-sizing: border-box; }

a.btn { color: inherit; text-decoration: none; display: inline-block; }

}

.modes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.cta { display: grid; gap: 14px; justify-items: start; padding-block: 28px; }
.section { display: grid; gap: 14px; padding-block: 24px; }
.section h2 { font-size: 26px; }
select { font: inherit; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.card-head { display: flex; justify-content: space-between; gap: 10px; padding: 10px 18px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; }
.card-body { padding: 22px 22px 24px; display: grid; gap: 18px; }

.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px 22px; }

.mrz { font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: 0.08em; border-top: 1px dashed var(--line); padding-top: 12px; word-break: break-all; }

/* ---------- Life ---------- */
.lifebar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 10px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.agerow { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }

.progress { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }

.lifegrid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; padding-top: 18px; align-items: start; }

@media (max-width: 560px) {

}
.side { display: grid; gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; }

.stat { display: grid; grid-template-columns: 44px minmax(0,1fr) 30px; gap: 8px; align-items: center; font-size: 13.5px; }

.logline.choice .tx { color: var(--accent); }
.logline.idle .tx { color: var(--muted); }

.overlay { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 70%, transparent); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); backdrop-filter: blur(3px); }
.dlg { width: min(560px, 100%); max-height: 100%; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: grid; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.dlg .head { display: flex; justify-content: space-between; gap: 10px; }

.deathcard .card-head { background: var(--ink); color: var(--bg); }

.curve svg { width: 100%; height: auto; display: block; }
.companions { display: grid; gap: 0; }

.sharebox { font-family: var(--font-mono); font-size: 12.5px; white-space: pre-wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }

.book { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }

  <!-- Life -->
  <section id="v-life" hidden>
    <div class="lifebar">
      <div class="agerow">
        <div class="age" id="lf-age"></div>
        <div class="mono small muted" id="lf-sub"></div>
      </div>
      <div class="progress"><i id="lf-prog"></i></div>
      <div class="controls" id="controls"></div>
    </div>
    <div class="lifegrid">
      <aside class="side">
        <div class="panel idcard" id="lf-id"></div>
        <div class="panel">
          <div class="eyebrow" data-t="status">状态</div>
          <div id="lf-stats" style="display:grid;gap:8px"></div>
        </div>
        <div class="panel sibs">
          <div class="eyebrow" id="lf-sibl"></div>
          <div class="big" id="lf-sibn"></div>
          <p class="small muted" id="lf-sibp"></p>
        </div>
      </aside>
      <div class="main">
        <div class="scene">
          <canvas id="scene" width="192" height="72"></canvas>
          <div class="cap" id="lf-cap"></div>
        </div>
        <div class="panel actpanel">
          <div class="row" style="justify-content:space-between">
            <h3 data-t="doingNow">你现在做什么</h3>
            <span class="eyebrow" data-t="anyTime">随时可换 · 按数字键</span>
          </div>
          <div class="acts" id="lf-acts"></div>
          <div class="row" style="justify-content:space-between">
            <p class="small muted" id="lf-act-desc"></p>
            <button class="btn-primary" type="button" id="lf-next" hidden style="font-size:15px;padding:8px 18px;letter-spacing:0.05em"></button>
          </div>
        </div>
        <div class="panel">
          <div class="row" style="justify-content:space-between">
            <h3 data-t="record">生命记录</h3>
            <span class="eyebrow" data-t="newest">最新在上</span>
          </div>
          <div class="log" id="lf-log"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Death -->
  <section id="v-death" hidden class="narrow" style="padding-block: 24px; display:grid; gap:18px"></section>

  <!-- A life opened from a link -->
  <section id="v-friend" hidden class="narrow" style="padding-block: 32px; display:grid; gap:20px"></section>

  <!-- Book -->
  <section id="v-book" hidden style="padding-block: 24px; display:grid; gap:18px"></section>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title"></div>
</div>

<script src="app.js?v=1fb6e25e" defer></script>
</body></html>
