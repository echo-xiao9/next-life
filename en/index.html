<style>
/* Layout: one narrow column for reading screens; the life screen is a two-column field station (specimen card | scene + record). Dark-first: most animals live in soil and deep water. */
:root {
  --bg: #0c1514;
  --surface: #121f1d;
  --surface-2: #182825;
  --ink: #dde6e1;
  --muted: #8b9c96;
  --line: #24352f;
  --accent: #ff7a4d;      /* astaxanthin: the red-orange of a copepod */
  --accent-ink: #1a0d07;
  --cyan: #6cc6c0;        /* plankton */
  --good: #7fc58a;
  --warn: #e6b450;
  --bad: #e0604a;
  --font-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --font-brush: "Ma Shan Zheng", "STKaiti", "KaiTi", serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #edf1ee; --surface: #ffffff; --surface-2: #f4f7f5; --ink: #13201d; --muted: #56665f; --line: #cfdad4;
    --accent: #d14e24; --accent-ink: #ffffff; --cyan: #23807a; --good: #2f8a45; --warn: #a8741a; --bad: #b8392a;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #edf1ee; --surface: #ffffff; --surface-2: #f4f7f5; --ink: #13201d; --muted: #56665f; --line: #cfdad4;
  --accent: #d14e24; --accent-ink: #ffffff; --cyan: #23807a; --good: #2f8a45; --warn: #a8741a; --bad: #b8392a;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body {
  font-family: var(--font-body); font-size: 15px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1080px; margin: 0 auto; }
.narrow { max-width: 720px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: 0.02em; }
p { margin: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 6px;
  padding: 6px 12px; font-size: 13.5px; line-height: 1.4;
}
.btn:hover { border-color: var(--muted); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn-primary {
  border: none; background: var(--accent); color: var(--accent-ink); border-radius: 8px;
  padding: 14px 34px; font-size: 18px; font-family: var(--font-display); letter-spacing: 0.15em;
}
.btn-primary:hover { filter: brightness(1.08); }

/* ---------- Landing ---------- */
.topnav { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 16px; flex-wrap: wrap; }
.brand { font-family: var(--font-brush); font-size: 24px; }
.brand b { color: var(--accent); font-weight: 400; }
.hero { padding-block: 24px 8px; display: grid; gap: 18px; }
.herosub { font-family: var(--font-display); font-size: clamp(22px, 4vw, 34px); margin-top: -6px; }
.herosub:empty { display: none; }
:root[lang="en"] { --fact-label: "Source "; --font-brush: "Noto Serif SC", Georgia, serif; } :root[lang="en"] .hero h1 { font-weight: 900; font-size: clamp(60px, 12vw, 118px); letter-spacing: -0.01em; } :root[lang="en"] .brand { font-weight: 900; font-size: 20px; }
.whats { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.what { display: grid; grid-template-columns: 68px minmax(0,1fr); gap: 14px; align-items: start; padding-block: 12px; border-top: 1px solid var(--line); }
.what .em { font-size: 48px; line-height: 1; }
.what h3 { font-size: 20px; margin-bottom: 4px; }
.what p { font-size: 14.5px; }
.oddsrow .wh { display: block; font-size: 12.5px; line-height: 1.55; color: var(--muted); }
.whatis { display: grid; gap: 4px; padding: 12px 14px; background: var(--surface-2); border-radius: 8px; }
.logline.data { background: var(--surface-2); margin-inline: -10px; padding-inline: 10px; border-radius: 6px; }
.logline .fact.plain::before { content: none; }
.src { color: var(--cyan); text-decoration: none; overflow-wrap: anywhere; } .src:hover { text-decoration: underline; }
.ev { display: inline-block; font-size: 11.5px; line-height: 1.5; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.ev-measured, .ev-official { color: var(--good); border-color: currentColor; } .ev-related { color: var(--warn); border-color: currentColor; } .ev-est { border-style: dashed; } .ev-rule { color: var(--cyan); border-color: currentColor; }
.evline { font-size: 14px; overflow-wrap: anywhere; }
.why h4, .srcsp h4 { margin: 8px 0 0; font-size: 15px; }
.parts { list-style: none; margin: 0; padding: 0; display: grid; } .parts li { display: flex; justify-content: space-between; gap: 12px; padding-block: 4px; border-top: 1px solid var(--line); font-size: 14px; } .parts .up { color: var(--bad); } .parts .down { color: var(--good); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--cyan); text-decoration: underline; }
.srcsp summary { cursor: pointer; } .srcsp[open] { gap: 8px; }
.sharegrid { display: grid; grid-template-columns: 240px minmax(0,1fr); gap: 18px; align-items: start; }
.cardimg { min-height: 200px; background: var(--surface-2); border-radius: 8px; overflow: hidden; }
.cardimg img { display: block; width: 100%; height: auto; }
.sharecol { display: grid; gap: 10px; min-width: 0; }
.sharebox { overflow-wrap: anywhere; }
.sharepanel.cardonly .sharecol { display: none; }
.sharepanel.cardonly .sharegrid { grid-template-columns: minmax(0, 420px); justify-content: center; }
.linkbtn { justify-self: start; }
a.btn { color: inherit; text-decoration: none; display: inline-block; }
.btn-primary.sm { font-size: 15px; padding: 7px 16px; letter-spacing: 0.04em; font-family: var(--font-body); font-weight: 500; }
@media (max-width: 560px) { .sharegrid { grid-template-columns: minmax(0,1fr); } .cardimg { max-width: 320px; margin-inline: auto; width: 100%; } }
.hero h1 { font-family: var(--font-brush); font-weight: 400; font-size: clamp(80px, 17vw, 168px); line-height: 1; letter-spacing: 0.05em; }
.bignum { font-family: var(--font-mono); font-size: clamp(13px, 2.6vw, 20px); color: var(--muted); line-height: 1.5; }
.bignum b { color: var(--accent); font-weight: 500; }
.lede { font-size: 17px; max-width: 36em; }

.oddsbar { display: flex; height: 34px; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.oddsbar > div { display: flex; align-items: center; padding-inline: 10px; font-size: 13px; white-space: nowrap; overflow: hidden; min-width: 0; }
.oddsbar .s0 { background: var(--accent); color: var(--accent-ink); }
.oddsbar .s1 { background: var(--cyan); color: var(--bg); }
.oddsbar .s2 { background: var(--surface-2); color: var(--muted); }

.oddslist { display: grid; grid-template-columns: 1fr; gap: 0; border-top: 1px solid var(--line); }
.oddsrow { display: grid; grid-template-columns: 28px minmax(0, 1fr) 120px 140px; gap: 10px; align-items: center; padding-block: 7px; border-bottom: 1px solid var(--line); font-size: 14px; }
.oddsrow .em { font-size: 18px; text-align: center; }
.oddsrow .nm small { color: var(--muted); margin-left: 6px; }
.oddsrow .bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.oddsrow .bar i { display: block; height: 100%; background: var(--cyan); }
.oddsrow .od { text-align: right; font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.conf { display: inline-block; font-family: var(--font-mono); font-size: 10.5px; padding: 0 5px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); vertical-align: 1px; }
.conf.low { border-style: dashed; }
@media (max-width: 560px) {
  .oddsrow { grid-template-columns: 24px minmax(0,1fr) 92px; }
  .oddsrow .bar { display: none; }
}

.modes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.cta { display: grid; gap: 14px; justify-items: start; padding-block: 28px; }
.section { display: grid; gap: 14px; padding-block: 24px; }
.section h2 { font-size: 26px; }
select { font: inherit; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }

/* ---------- Reveal ---------- */
.reveal { min-height: 70vh; display: grid; place-content: center; text-align: center; gap: 10px; }
.reveal .em { font-size: 64px; line-height: 1; }
.reveal .nm { font-family: var(--font-display); font-size: clamp(40px, 10vw, 84px); line-height: 1.1; }

/* ---------- Specimen card (birth) ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.card-head { display: flex; justify-content: space-between; gap: 10px; padding: 10px 18px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; }
.card-body { padding: 22px 22px 24px; display: grid; gap: 18px; }
.specname { display: flex; gap: 16px; align-items: center; }
.specname .em { font-size: 52px; line-height: 1; }
.specname h2 { font-size: 40px; line-height: 1.1; }
.specname .sci { font-style: italic; color: var(--muted); font-size: 14px; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px 22px; }
.field .eyebrow { display: block; margin-bottom: 2px; }
.field .v { font-size: 15px; }
.field .v.mono { font-size: 14px; }
.mrz { font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: 0.08em; border-top: 1px dashed var(--line); padding-top: 12px; word-break: break-all; }
.compare { width: 100%; border-collapse: collapse; font-size: 14px; }
.compare th, .compare td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.compare td.mono, .compare th.mono { text-align: right; }

/* ---------- Life ---------- */
.lifebar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 10px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.agerow { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.agerow .age { font-family: var(--font-display); font-size: 40px; line-height: 1; }
.agerow .age small { font-size: 18px; margin-left: 4px; }
.progress { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.controls { display: flex; gap: 6px; flex-wrap: wrap; }
.lifegrid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; padding-top: 18px; align-items: start; }
@media (max-width: 820px) { .lifegrid { grid-template-columns: minmax(0, 1fr); } .lifegrid .side { order: 2; } }
@media (max-width: 560px) {
  .controls { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .controls .btn { flex: none; }
  .logline { grid-template-columns: 64px minmax(0,1fr); gap: 8px; }
  .agerow .age { font-size: 32px; }
}
.side { display: grid; gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; }
.panel h3 { font-size: 18px; }
.idcard .top { display: flex; gap: 12px; align-items: center; }
.idcard .em { font-size: 40px; }
.idcard h3 { font-size: 22px; }
.kv { display: grid; grid-template-columns: 70px minmax(0,1fr); gap: 4px 10px; font-size: 13.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.stat { display: grid; grid-template-columns: 44px minmax(0,1fr) 30px; gap: 8px; align-items: center; font-size: 13.5px; }
.stat .track { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.stat .track i { display: block; height: 100%; transition: width .3s; }
.stat .n { font-family: var(--font-mono); font-size: 12px; text-align: right; }
.sibs .big { font-family: var(--font-mono); font-size: 26px; line-height: 1.2; }
.main { display: grid; gap: 14px; min-width: 0; }
.scene { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #000; }
.scene canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; aspect-ratio: 16 / 6; }
.scene .cap { background: var(--surface); padding: 8px 14px; font-size: 13.5px; color: var(--muted); }
.log { display: grid; gap: 0; max-height: 560px; overflow-y: auto; }
.logline { display: grid; grid-template-columns: 92px minmax(0,1fr); gap: 12px; padding-block: 9px; border-top: 1px solid var(--line); }
.logline .t { font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding-top: 2px; }
.logline .tx { font-size: 15px; }
.logline .fact { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
.logline .fact::before { content: var(--fact-label, "依据 "); font-family: var(--font-mono); color: var(--cyan); }
.logline.stage .tx { font-family: var(--font-display); font-size: 18px; color: var(--cyan); }
.logline.choice .tx { color: var(--accent); }
.logline.idle .tx { color: var(--muted); }
.logline.bad .tx { color: var(--bad); }

/* ---------- Decision ---------- */
.overlay { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 70%, transparent); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); backdrop-filter: blur(3px); }
.dlg { width: min(560px, 100%); max-height: 100%; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: grid; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.dlg .head { display: flex; justify-content: space-between; gap: 10px; }
.dlg h2 { font-size: 28px; }
.dlg .fact { font-size: 13px; color: var(--muted); border-left: 3px solid var(--cyan); padding: 6px 10px; background: var(--surface-2); }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 4px 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.opt:hover { border-color: var(--accent); }
.opt .k { font-family: var(--font-mono); color: var(--muted); font-size: 12px; padding-top: 3px; }
.opt .tt { font-weight: 500; }
.opt .h { grid-column: 2; font-size: 12.5px; color: var(--muted); font-family: var(--font-mono); }

/* ---------- Death ---------- */
.deathcard .card-head { background: var(--ink); color: var(--bg); }
.cause { font-family: var(--font-display); font-size: 26px; color: var(--bad); }
.lifemap { display: flex; flex-wrap: wrap; gap: 2px; }
.lifemap i { width: 9px; height: 9px; border-radius: 1px; display: block; }
.lifemap i.skip { background: transparent; border: 1px dashed var(--muted); }
.curve svg { width: 100%; height: auto; display: block; }
.companions { display: grid; gap: 0; }
.comp { display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 10px; padding-block: 8px; border-top: 1px solid var(--line); font-size: 14px; }
.comp .em { font-size: 20px; text-align: center; }
.sharebox { font-family: var(--font-mono); font-size: 12.5px; white-space: pre-wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spr { image-rendering: pixelated; height: auto; vertical-align: middle; display: inline-block; }
.acts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.act { text-align: left; display: grid; grid-template-columns: 18px minmax(0,1fr); gap: 2px 8px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.act:hover { border-color: var(--muted); }
.act[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface-2)); }
.act .k { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); padding-top: 2px; }
.act .hints { grid-column: 2; display: flex; gap: 4px; flex-wrap: wrap; }
.act .chip { font-size: 10.5px; padding: 0 6px; }
.chip { font-family: var(--font-mono); font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
.chip.up { color: var(--good); border-color: color-mix(in srgb, var(--good) 50%, transparent); }
.chip.down { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, transparent); }

/* ---------- Book ---------- */
.book { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.bk { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 2px; justify-items: start; }
.bk .em { font-size: 28px; }
.bk.locked { opacity: 0.45; }
.bk.locked .em { filter: grayscale(1) brightness(0.2); }
.bk .od { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
.pastlives { display: grid; gap: 0; }
.pl { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; gap: 10px; padding-block: 8px; border-top: 1px solid var(--line); font-size: 14px; align-items: center; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- photographs, goals, timing ---------- */
.boot { min-height: 90vh; display: grid; place-content: center; } .boot i { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(1turn); } }
.ph { object-fit: cover; border-radius: 10px; vertical-align: middle; background: var(--surface-2); display: inline-block; flex: none; }
button.what, button.oddsrow, button.bk, button.top { border: 0; background: none; text-align: left; width: 100%; padding-inline: 0; color: inherit; }
button.what { display: grid; grid-template-columns: 84px minmax(0,1fr); border-top: 1px solid var(--line); border-radius: 0; } button.what:hover h3, button.oddsrow:hover .nm, button.top:hover h3 { color: var(--accent); }
.morelink { font-size: 13px; color: var(--cyan); }
.oddsrow { grid-template-columns: 48px minmax(0, 1fr) 120px 140px; border-bottom: 1px solid var(--line) !important; border-radius: 0; }
button.bk { border: 1px solid var(--line); background: var(--surface); padding: 12px; gap: 6px; } button.bk:hover:enabled { border-color: var(--accent); } .bk .em img, .bk .em .ph { width: 100% !important; height: auto !important; aspect-ratio: 1; } .bk .em { width: 100%; } .bk.locked .em { filter: grayscale(1) brightness(.25) blur(5px); overflow: hidden; border-radius: 10px; }
.hero-ph { margin: 0; position: relative; background: var(--surface-2); } .hero-ph img { display: block; width: 100%; aspect-ratio: 16 / 8; object-fit: cover; } .hero-ph figcaption { position: absolute; right: 8px; bottom: 8px; } .hero-ph.big img { aspect-ratio: 16 / 9; }
.credit { display: inline-block; font-size: 11px; line-height: 1.4; color: #fff; background: rgba(0,0,0,.55); padding: 2px 7px; border-radius: 5px; text-decoration: none; max-width: 100%; } .credit:hover { text-decoration: underline; }
.reveal .em .ph { border-radius: 24px; } .comp .em .ph, .pl .ph { border-radius: 7px; } .comp, .pl { grid-template-columns: 38px minmax(0,1fr) auto; } .comp { grid-template-columns: 38px minmax(0,1fr); }
.idcard .top { display: flex; gap: 12px; align-items: center; }

<div id="boot" class="boot"><i></i></div>
<div id="app" class="wrap" hidden>
  <nav class="topnav">
    <div class="brand" data-t="title"></div>

      <button class="btn" id="nav-home" type="button" data-t="navHome"></button>

  <!-- Landing -->

      <div class="eyebrow" data-t="heroEyebrow"></div>

    <div class="cta">

        <select id="pick"></select>
      </div>
      <button class="btn-primary" id="go" type="button" data-t="go"></button>
      <p class="small muted" id="modenote"></p>
      <p class="small muted" data-t="protectNote"></p>

    <div class="section">
      <div class="eyebrow" data-t="ifNow"></div>
      <div class="oddsbar" id="oddsbar"></div>
      <p class="small muted" id="oddsnote"></p>
      <div class="whats" id="whats"></div>
    </div>
    <div class="section">
      <h2 data-t="allSpecies"></h2>
      <p class="small muted" data-th="legend"></p>
      <div class="oddslist" id="oddslist"></div>
    </div>
  </section>

  <section id="v-reveal" hidden>
    <div class="reveal">
      <div class="eyebrow" id="rv-line"></div>
      <div class="em" id="rv-em"></div>
      <div class="nm" id="rv-nm"></div>
      <div class="mono small muted" id="rv-od"></div>

      <div class="agerow">

        <div class="mono small muted" id="lf-sub"></div>
      </div>
      <div class="progress"><i id="lf-prog"></i></div>
      <div class="controls" id="controls"></div>
    </div>
    <div class="lifegrid">
      <aside class="side">
        <div class="panel idcard" id="lf-id"></div>
        <div class="panel">

        </div>

          <div class="row" style="justify-content:space-between">
            <h3 data-t="record"></h3>
            <span class="eyebrow" data-t="newest"></span>

          <div class="log" id="lf-log"></div>

  <section id="v-friend" hidden class="narrow" style="padding-block: 32px; display:grid; gap:20px"></section>

  <section id="v-src" hidden class="narrow" style="padding-block: 24px; display:grid; gap:14px"></section>

<div id="bio" hidden></div>
